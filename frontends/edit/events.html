<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Events &amp; QA - DC Tech Events Admin</title>
  <link rel="stylesheet" href="/edit/css/styles.css">
  <script src="/edit/js/config.js"></script>
  <script src="/edit/js/auth.js"></script>
</head>
<body>
  <nav class="nav">
    <div class="container" style="display:flex; justify-content: space-between; align-items: center; width: 100%; max-width: 1100px;">
      <div style="display:flex; align-items: center; gap: 2rem;">
        <a href="index.html" class="nav-brand" id="nav-brand">DC Tech Events Edit</a>
        <ul class="nav-links" data-auth="admin">
          <li><a href="queue.html">Queue</a></li>
          <li><a href="events.html" style="font-weight: bold;">Events</a></li>
          <li><a href="posts.html">Posts</a></li>
          <li><a href="subscribers.html">Subscribers</a></li>
        </ul>
      </div>
      <div class="nav-right">
        <span data-auth="logged-in" class="hidden">
          <span data-user="name"></span>
          <button class="btn-sign-out" onclick="DctechAuth.logout()">Sign Out</button>
        </span>
      </div>
    </div>
  </nav>

  <main class="container" style="max-width: 1100px;">
    <div class="page-header flex justify-between items-center">
      <div>
        <h1>Events &amp; QA</h1>
        <p>Browse the calendar, work the review queue, and correct what the
           feeds get wrong.</p>
      </div>
      <div style="display:flex; gap:0.5rem;">
        <button class="btn btn-outline" id="events-rebuild">Rebuild site</button>
        <button class="btn btn-outline" id="events-refresh">Refresh</button>
      </div>
    </div>

    <div id="events-message"></div>

    <div class="card">
      <div class="toolbar">
        <div class="filters-bar">
          <label class="toolbar-label" for="filter-view">View</label>
          <select id="filter-view" class="form-control" style="width:auto;">
            <option value="pending_qa">Needs review</option>
            <option value="any">All upcoming</option>
            <option value="flagged">Flagged</option>
            <option value="overlaid">Has an overlay</option>
            <option value="agent">Agent-touched</option>
            <option value="hidden">Hidden</option>
            <option value="duplicate">Merged</option>
            <option value="problems">Problems</option>
            <option value="uncategorized">Uncategorized</option>
          </select>

          <label class="toolbar-label" for="filter-source">Source</label>
          <select id="filter-source" class="form-control" style="width:auto;">
            <option value="">Any</option>
            <option value="ical">iCal</option>
            <option value="manual">Manual</option>
            <option value="submitted">Submitted</option>
          </select>

          <input type="search" id="filter-q" class="form-control"
                 placeholder="Search title, location, group"
                 style="width:220px;">

          <label class="toolbar-label" style="display:flex; align-items:center; gap:0.3rem; cursor:pointer;">
            <input type="checkbox" id="filter-past"> Include past
          </label>
        </div>
      </div>

      <div class="toolbar">
        <div class="bulk-actions">
          <span class="toolbar-label">Bulk</span>
          <button class="btn btn-sm btn-success" data-bulk="approve" disabled>Approve reviewed</button>
          <button class="btn btn-sm btn-outline" data-bulk="flag" disabled>Flag</button>
          <select id="bulk-category" class="form-control" style="width:170px;">
            <option value="">Add category…</option>
          </select>
          <button class="btn btn-sm btn-outline" data-bulk="add_category" disabled>Apply</button>
          <button class="btn btn-sm btn-outline" data-bulk="unhide" disabled>Unhide</button>
          <button class="btn btn-sm btn-danger" data-bulk="hide" disabled>Hide</button>
          <button class="btn btn-sm btn-danger" data-bulk="combine" disabled>Merge…</button>
        </div>
      </div>

      <div id="events-loading" class="htmx-indicator">
        <span class="spinner"></span> Loading events…
      </div>

      <div id="events-confirm"></div>
      <div id="events-table"></div>
      <div id="events-footer" class="text-muted"
           style="margin-top:1rem; font-size:0.875rem;"></div>
    </div>
  </main>

  <script src="/edit/js/events.js"></script>
  <script>
    DctechEventsPage.init();
  </script>
</body>
</html>
