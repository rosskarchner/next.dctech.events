<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signing In... - DC Tech Events</title>
  <link rel="stylesheet" href="../css/styles.css">
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
</head>
<body>
  <main class="container" style="max-width: 500px; margin-top: 80px; text-align: center;">
    <div class="card">
      <div id="callback-status">
        <span class="spinner"></span>
        <p style="margin-top: 1rem;">Signing you in...</p>
      </div>

      <div id="callback-error" style="display: none;">
        <h2>Sign-In Failed</h2>
        <p id="error-message" class="text-muted mt-1"></p>
        <button class="btn btn-primary mt-2" onclick="DctechAuth.login()">Try Again</button>
      </div>
    </div>
  </main>

  <script>
    (async function handleCallback() {
      const statusEl = document.getElementById('callback-status');
      const errorEl = document.getElementById('callback-error');
      const errorMsg = document.getElementById('error-message');

      function showError(message) {
        statusEl.style.display = 'none';
        errorMsg.textContent = message;
        errorEl.style.display = 'block';
      }

      try {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const state = params.get('state');
        const error = params.get('error');
        const errorDescription = params.get('error_description');

        if (error) {
          showError(errorDescription || error);
          return;
        }

        if (!code) {
          showError('No authorization code received.');
          return;
        }

        // state is a random nonce from DctechAuth.login; anything else means
        // this callback was not started by this browser (login CSRF).
        const savedState = sessionStorage.getItem('oauth_state');
        sessionStorage.removeItem('oauth_state');
        if (!state || !savedState || state !== savedState) {
          showError('Sign-in session did not match. Please try again.');
          return;
        }

        await DctechAuth.exchangeCodeForTokens(code);

        // Same-origin paths only: '//evil.com' and '/\\evil.com' both start
        // with '/' but navigate off-site.
        const returnPath = sessionStorage.getItem('oauth_return_path') || '/';
        sessionStorage.removeItem('oauth_return_path');
        const isLocalPath = returnPath.startsWith('/')
          && !returnPath.startsWith('//') && !returnPath.startsWith('/\\');
        window.location.href = isLocalPath ? returnPath : '/';

      } catch (err) {
        console.error('Callback error:', err);
        showError('An unexpected error occurred: ' + err.message);
      }
    })();
  </script>
</body>
</html>
