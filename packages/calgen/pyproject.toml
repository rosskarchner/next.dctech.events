[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calgen"
version = "0.1.0"
description = "A static site generator for local tech event calendars"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "flask>=3.0",
    "Frozen-Flask>=1.0",
    "jinja2>=3.0",
    "pyyaml>=6.0",
    "pytz>=2024.1",
    "icalendar>=5.0",
    "requests>=2.28",
    "usaddress>=0.5",
    "recurring-ical-events>=2.0",
    "dateparser>=1.1",
    "python-dateutil>=2.8",
    "click>=8.0",
    "beautifulsoup4>=4.11",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
# Only `calgen og-images`/`og-preview` (og_image.py) need this — everything
# else that installs calgen (the ical aggregator and newsletter Lambdas, via
# cdk_next/build_lambdas.sh's local cross-platform `uv pip install --target`
# steps) does not, and making Pillow a mandatory dependency broke exactly
# that: uv cross-compiling calgen's full dependency set for a foreign
# platform locally has no matching prebuilt Pillow wheel to fall back on and
# no C toolchain to build one from source. The site generator's CodeBuild
# install step (a real `pip install` on a real matching machine, not a local
# cross-compile) installs this extra explicitly instead.
cards = [
    "Pillow>=10.1",
]

[project.scripts]
calgen = "calgen.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/calgen"]
