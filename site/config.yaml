# DC Tech Events Configuration

# Site name (defaults for dctech.events)
site_name: "DC Tech Events"
tagline: Technology conferences and meetups in and around Washington, DC
base_url: https://dctech.events
add_events_link: https://dctech.events/edit/submit-event.html
add_groups_link: https://dctech.events/edit/submit-group.html
newsletter_signup_link: https://dctech.events/newsletter/
edit_home_link: https://dctech.events/edit/index.html
newsletter_preferences_link: https://dctech.events/edit/preferences.html

# Timezone for event display and processing
timezone: "US/Eastern"

location: "Washington, DC"
max_distance_miles: 50

# GitHub OAuth Configuration (for event submission)
# Client ID is set via GITHUB_CLIENT_ID environment variable from GitHub Repository Variable
# See OAUTH_SETUP.md for detailed setup instructions
github_client_id: ""  # Set via GITHUB_CLIENT_ID environment variable
oauth_callback_endpoint: "https://add.dctech.events/oauth/callback"

# Weekly sponsorship price in USD, shown on /sponsor/. Must equal
# SPONSOR_WEEK_PRICE_USD in cdk_next/config.py, which is what the booking API
# actually charges (a test checks). "0" hides the price.
sponsorship_price_usd: "50"

# Shown in the header and the newsletter in weeks nobody has sponsored. It is
# deliberately not used on week pages or in the Monday/Thursday posts. A url
# starting with "/" is made absolute (base_url) in the newsletter.
sponsorship_house_ad:
  name: "Sponsor DC Tech Events!"
  message: "Get your message out and help support this site."
  url: /sponsor/

# DynamoDB Configuration
# Table name for storing event tracking data
dynamodb_table: "DcTechEvents"
